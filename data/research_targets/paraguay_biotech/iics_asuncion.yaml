notes: |
  IICS operates under a fundamentally different business model than commercial
  laboratories like Meyer Lab, San Roque, or Curie. Key differences:

  - Mission: Academic research and public health vs. commercial diagnostics
  - Funding: Government/university funding vs. fee-for-service revenue
  - Pricing: Likely subsidized or cost-recovery vs. profit-oriented
  - Services: Research-focused with diagnostic capabilities vs. diagnostic-focused
  - Target population: Public health and academic community vs. private patients

  During COVID-19, IICS served as a contingency technical laboratory, demonstrating
  its role in public health emergency response alongside commercial laboratories.

  Research should focus on:
  - Understanding the academic-clinical interface
  - Role in public health vs. commercial diagnostics
  - Research output and publications
  - Collaboration with Ministry of Health and commercial labs
  - Technology capabilities compared to private sector

  Financial data will be limited and not directly comparable to commercial labs.
  Focus on institutional role, capabilities, and public health mission.

  This profile is included to understand the full diagnostic ecosystem in Paraguay,
  including both commercial and academic/public health components. IICS is not a
  direct competitor to Meyer Lab but plays a complementary role in the healthcare system.
