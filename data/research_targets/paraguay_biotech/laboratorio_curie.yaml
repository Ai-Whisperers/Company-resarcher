notes: |
  Laboratorio Curie differentiates through specialization in cancer genomics and
  next-generation sequencing (NGS), positioning as a precision medicine specialist
  rather than a general clinical laboratory.

  Key research questions:
  - How does Curie's NGS specialization compare to Meyer Lab's Mayo Clinic
    partnership for advanced testing?
  - What is the addressable market for cancer genomics in Paraguay?
  - Does Curie send samples internationally for ultra-specialized testing or
    perform all NGS in-house?
  - How does pricing compare for specialized genomic testing vs. routine molecular?

  This profile represents the emerging segment of personalized medicine and precision
  oncology in Paraguay. Understanding Curie's capabilities and market positioning
  will illuminate the evolution from routine diagnostics to advanced genomics.

  As a private specialized laboratory, financial data will be extremely limited.
  Focus on service offerings, technology platform, market positioning, and
  competitive differentiation.
