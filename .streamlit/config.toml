# Streamlit Configuration
# UX-002: Dark Mode Support
#
# Theme options: "light", "dark", or "auto" (follows system preference)
# Set STREAMLIT_THEME=dark in environment to override

[theme]
# Base theme - auto follows system preference
base = "dark"

# Primary accent color (blue)
primaryColor = "#2196F3"

# Background colors
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"

# Text color
textColor = "#FAFAFA"

# Font
font = "sans serif"


[server]
# Enable CORS for development
enableCORS = false

# Enable XSRF protection
enableXsrfProtection = true

# Server address
address = "0.0.0.0"

# Server port
port = 8501

# Run headless (no browser auto-open)
headless = true


[browser]
# Disable file watcher for production
gatherUsageStats = false


[runner]
# Magic commands enabled
magicEnabled = true

# Install tracer for debugging
installTracer = false


[logger]
# Logging level
level = "info"


[client]
# Show error details
showErrorDetails = true

# Caching configuration
caching = true
