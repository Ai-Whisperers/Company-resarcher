[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-researcher"
version = "0.1.0"
description = "Multi-agent autonomous company research platform using LangGraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AI Whisperers"}
]
keywords = [
    "ai",
    "research",
    "multi-agent",
    "langgraph",
    "langchain",
    "company-research",
    "autonomous-agents"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core Frameworks
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",

    # AI Providers
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-groq>=0.1.0",

    # Tools & Browsing
    "tavily-python>=0.3.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.0.0",
    "llama-parse>=0.4.0",
    "pypdf>=4.0.0",
    "yfinance>=0.2.32",
    "newsapi-python>=0.2.7",
    "aiolimiter>=1.1.0",
    "tiktoken>=0.5.0",

    # API & Web
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.31.0",
    "python-multipart>=0.0.9",

    # Data & Storage
    "pandas>=2.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "colorlog>=6.8.0",
    "tenacity>=8.2.0",

    # Observability
    "langfuse>=2.0.0",
    "langsmith>=0.1.0",

    # Metrics
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-html>=4.1.0",
    "pytest-randomly>=3.15.0",
    "pytest-rerunfailures>=13.0",
    "pytest-vcr>=1.0.2",
    "vcrpy>=6.0.1",
    "syrupy>=4.6.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
    "faker>=22.0.0",
    "hypothesis>=6.100.0",
    "pact-python>=2.0.0",
    "mutmut>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/ai-whisperers/Company-researcher"
Documentation = "https://github.com/ai-whisperers/Company-researcher#readme"
Repository = "https://github.com/ai-whisperers/Company-researcher.git"
Issues = "https://github.com/ai-whisperers/Company-researcher/issues"

[project.scripts]
company-researcher = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | temp_repos
  | outputs
  | outputs_test
  | data
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "temp_repos",
    "outputs",
    "outputs_test",
    "data",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "temp_repos/",
    "outputs/",
    "outputs_test/",
    "data/",
]

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--strict-markers",
    "--timeout=60",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast (<100ms)",
    "integration: marks tests as integration tests",
    "manual: marks tests that require manual verification",
    "unit: marks tests as unit tests (fast, isolated)",
    "requires_api: marks tests that require real API keys",
    "smoke: marks tests as smoke tests (quick verification)",
    "e2e: marks tests as end-to-end tests",
    "security: marks tests as security tests",
    "regression: marks tests as regression tests",
    "concurrent: marks tests that test concurrency",
    "chaos: marks chaos engineering tests",
    "contract: marks API contract tests",
    "snapshot: marks snapshot tests",
    "serial: marks tests that must run serially (not in parallel)",
    "flaky: marks tests that may fail intermittently (reruns enabled)",
    "vcr: marks tests that use VCR for HTTP recording",
]

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "src/ui/*",
    "src/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "pass",
    "\\.\\.\\.",
]
fail_under = 50
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"
title = "Company Researcher Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/"
runner = "python -m pytest -x --tb=no -q"
dict_synonyms = ["Struct", "NamedTuple"]
backup = false
