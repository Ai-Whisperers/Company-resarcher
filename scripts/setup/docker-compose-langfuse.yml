version: '3.8'

services:
  # PostgreSQL database for LangFuse
  postgres:
    image: postgres:15
    container_name: langfuse-db
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LangFuse Web UI & API
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: changeme-generate-a-secret-key-here
      SALT: changeme-generate-a-salt-here
      # Optional: Enable OAuth if needed
      # AUTH_GOOGLE_CLIENT_ID: your-google-client-id
      # AUTH_GOOGLE_CLIENT_SECRET: your-google-client-secret
    restart: unless-stopped

volumes:
  langfuse_db:

# Usage:
# 1. docker-compose -f docker-compose-langfuse.yml up -d
# 2. Open: http://localhost:3000
# 3. Create an account (stored locally)
# 4. Get your API keys from settings
# 5. Add to .env:
#    LANGFUSE_PUBLIC_KEY=pk-...
#    LANGFUSE_SECRET_KEY=sk-...
#    LANGFUSE_HOST=http://localhost:3000
