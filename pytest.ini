[pytest]
minversion = 7.0
asyncio_mode = auto
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast (<100ms)
    integration: marks tests as integration tests
    manual: marks tests that require manual verification
    unit: marks tests as unit tests (fast, isolated)
    e2e: marks tests as end-to-end tests
    security: marks security-related tests
    regression: marks regression tests
    smoke: marks smoke tests for quick validation
    property: marks property-based tests (Hypothesis)
    benchmark: marks performance benchmark tests
    load: marks load/stress tests
    requires_api: marks tests that require real API keys
    concurrent: marks tests that test concurrency
    chaos: marks chaos engineering tests
    contract: marks API contract tests
    snapshot: marks snapshot tests
    serial: marks tests that must run serially (not in parallel)
